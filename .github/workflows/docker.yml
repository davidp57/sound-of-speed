# Construit l'image et la publie sur le registre de conteneurs GitHub.
#
# Le NAS n'a alors plus rien à construire ni à recevoir : Portainer tire une
# image déjà prête. Mettre à jour tient en un « git push » suivi d'un bouton
# dans l'interface de Portainer.
#
# Deux images sortent de ce dépôt, du même commit : l'application, servie par
# nginx, et le profileur, qui relit les traces déposées sur le serveur. Les deux
# partagent le cœur du projet, et c'est pourquoi elles doivent venir du même
# commit — un seul calcul, pas deux qui divergent.
#
# Trois étiquettes, trois usages :
#   latest    la production, poussée depuis `main` seulement
#   develop   l'intégration, pour essayer sur le NAS avant de sortir une version
#   vX.Y.Z    une version figée, poussée par le tag correspondant
# Une pile Portainer qui tire `develop` sur un autre port permet de vérifier un
# lot en conditions réelles sans toucher à celle qui sert dans la voiture.

name: Image Docker

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  # Les pull requests **construisent et essaient** l'image, sans rien publier.
  #
  # Elles ne le faisaient pas, et ça s'est payé le 12 septembre 2026 : une PR
  # entièrement verte a été fusionnée alors que l'image ne se construisait plus.
  # Le `.dockerignore` écartait le dossier qui venait d'être ajouté, ce qu'aucun
  # test du dépôt ne pouvait voir — ils tournent sur les sources, pas sur
  # l'image. Le défaut n'est apparu qu'au push sur `develop`, donc trop tard.
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  # L'image se construit, démarre, et **sonne** — sans qu'on ait rien déposé.
  #
  # Ce job ne publie rien : il ne sert qu'à ce qu'une PR dise la vérité sur
  # l'image. Une seule architecture, parce qu'on vérifie un comportement et non
  # un portage.
  essai:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: sound-of-speed:essai
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Monter une pile complète, comme chez quelqu'un qui installe
        run: |
          set -euo pipefail

          # Les dossiers de données, **vides** : c'est la situation de qui vient
          # d'installer la pile. Celui des échantillons se monte par-dessus ce
          # que l'image contient, et masque donc la démonstration — c'est
          # exactement ce qu'on vérifie plus bas.
          mkdir -p /tmp/pile/{audio,profiles,traces,journal,mesures,mesure-voiture}

          # Le serveur écrit dans quatre de ces dossiers sous son propre compte,
          # qui n'est pas celui qui vient de les créer : sans cette ouverture, un
          # dépôt ne rend pas 403 mais **500**, et le contrat désignerait la
          # mauvaise cause. C'est une pile jetable, à l'intérieur d'un runner.
          chmod -R 777 /tmp/pile

          # Un compte, sans quoi les quatre dossiers de dépôt rendent 500 : nginx
          # exige son fichier de mots de passe dès qu'il demande un compte.
          #
          node scripts/accord/htpasswd-essai.mjs /tmp/pile/htpasswd essai essai

          docker run -d --name essai -p 8088:80 \
            -v /tmp/pile/audio:/usr/share/nginx/html/audio:ro \
            -v /tmp/pile/profiles:/usr/share/nginx/html/profiles \
            -v /tmp/pile/traces:/usr/share/nginx/html/traces \
            -v /tmp/pile/journal:/usr/share/nginx/html/journal \
            -v /tmp/pile/mesures:/usr/share/nginx/html/mesures \
            -v /tmp/pile/mesure-voiture:/usr/share/nginx/html/mesure-voiture:ro \
            -v /tmp/pile/htpasswd:/etc/nginx/htpasswd:ro \
            sound-of-speed:essai

          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://localhost:8088/index.html && break
            sleep 1
          done
          curl -fsS -o /dev/null http://localhost:8088/index.html

      - name: La démonstration est servie malgré le montage des échantillons
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null http://localhost:8088/audio/demo/profil.json
          curl -fsS -o /dev/null http://localhost:8088/audio/demo/on-800.flac
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:8088/audio/procar/procar-on-low.wav)" = 404

      - name: Le contrat avec le client est tenu
        # Le seul contrôle qui regarde ce que le **serveur** rend. Les tests du
        # dépôt tournent sur les sources et n'en voient rien.
        #
        # Toutes les parts sauf `entites` et `trajets` : le registre des moteurs
        # et des boîtes est né avec la base, et regrouper des tranches en trajets
        # suppose la même chose. Ce serveur-ci n'a jamais eu à rendre ni l'un ni
        # l'autre. Ce ne sont pas des cas qu'on lui épargne, ce sont des
        # questions qui ne se posent pas pour lui.
        run: |
          node scripts/accord/accord.mjs http://localhost:8088             --compte essai:essai --part publique,profils,depots

      # --- Le serveur qui remplacera celui-là ---------------------------------
      #
      # Le même jeu de requêtes, joué contre le serveur neuf. Deux fois : hors
      # conteneur d'abord, ce qui dit vite si le code tient ; **dans son
      # conteneur** ensuite, ce qui est la seule façon de savoir si l'image sait
      # démarrer. Une image qui ne démarre pas est passée à travers une pull
      # request entièrement verte le 12 septembre 2026, faute d'un contrôle comme
      # celui-là.
      - name: Le serveur neuf tient le contrat en entier
        run: |
          set -euo pipefail
          # L'application construite, puis le serveur qui la sert : deux paquets
          # distincts, et le second ne sait rien faire sans le premier.
          npm run build
          npm run build:serveur
          SPEED_PORT=8099 \
          SPEED_DB=/tmp/serveur-neuf/speed.db \
          SPEED_AUDIO=/tmp/pile/audio \
          node dist-serveur/serveur.js &
          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://localhost:8099/ && break
            sleep 1
          done
          # Le contrat **en entier**, comme contre le serveur en service : depuis
          # que les dépôts de la voiture passent en base, les deux serveurs
          # doivent être indiscernables. Plus aucune part n'est exclue.
          # Plus de compte à fournir : le jeu prend le sien au serveur, comme un
          # navigateur qui ouvre l'application pour la première fois.
          node scripts/accord/accord.mjs http://localhost:8099

      - name: Construire l'image du serveur
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.serveur
          platforms: linux/amd64
          push: false
          load: true
          tags: sound-of-speed-serveur:essai
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: La pile à un service démarre et tient le contrat
        # Le contrôle qui manquait. Tout le reste s'exécute hors conteneur et ne
        # dit rien de l'image : ni que les dépendances s'y installent, ni que les
        # migrations s'y jouent, ni que le serveur y démarre.
        run: |
          set -euo pipefail

          # Un dossier de données vide, comme chez qui vient d'installer la pile.
          # Rien d'autre à préparer : plus de fichier de mots de passe, chaque
          # appareil ayant son compte.
          mkdir -p /tmp/serveur/audio
          chmod -R 777 /tmp/serveur

          docker run -d --name serveur -p 8100:80 \
            -v /tmp/serveur:/data \
            sound-of-speed-serveur:essai

          for _ in $(seq 60); do
            curl -fsS -o /dev/null http://localhost:8100/ && break
            sleep 1
          done

          echo "--- la base s'est créée et migrée toute seule"
          test -f /tmp/serveur/speed.db

          echo "--- et le contrat est tenu, depuis l'image"
          node scripts/accord/accord.mjs http://localhost:8100

      - name: La base survit au remplacement du conteneur
        # La promesse du ticket 03, qui n'avait jamais pu être vérifiée faute de
        # conteneur qui porte cette base.
        run: |
          set -euo pipefail
          # Un appareil se présente et garde son témoin. C'est lui qui ouvre les
          # dépôts, et il devra encore les ouvrir après le remplacement du
          # conteneur : le secret qui signe ce témoin vit dans le volume, donc il
          # survit lui aussi. Ce contrôle le vérifie du même coup.
          temoin=$(curl -s -D - -o /dev/null -X POST -H 'Content-Type: application/json' \
            -d '{}' http://localhost:8100/api/auth/sign-in/anonymous \
            | grep -i '^set-cookie:' | cut -d' ' -f2 | cut -d';' -f1)
          test -n "$temoin"

          avant=$(curl -s -H "Cookie: $temoin" http://localhost:8100/profiles/ | wc -c)
          curl -fsS -H "Cookie: $temoin" -X PUT --data '{"name":"Survivant"}' \
            http://localhost:8100/profiles/survivant.json

          docker rm -f serveur
          docker run -d --name serveur-bis -p 8101:80 \
            -v /tmp/serveur:/data \
            sound-of-speed-serveur:essai
          for _ in $(seq 60); do
            curl -fsS -o /dev/null http://localhost:8101/ && break
            sleep 1
          done

          echo "--- le profil déposé avant le remplacement est toujours là"
          curl -fsS -H "Cookie: $temoin" http://localhost:8101/profiles/survivant.json \
            | grep -q Survivant
          echo "(taille du listage avant dépôt : $avant octets)"

      - if: always()
        run: |
          docker logs essai || true
          docker logs serveur || true
          docker logs serveur-bis || true

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Vérifie le code avant de publier quoi que ce soit : une image qui ne
      # compile pas n'a rien à faire dans le registre.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - id: meta-profileur
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}-profileur
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Les deux architectures que l'on rencontre sur un NAS. La
          # construction reste native grâce à BUILDPLATFORM dans le Dockerfile.
          platforms: linux/amd64,linux/arm64
          # Aucune image publiée ne porte les écrans de banc, pas même
          # l'image d'intégration : c'est elle qu'on essaie dans la voiture, et
          # elle démarrait sur le simulateur au lieu du GPS. Le banc reste en
          # développement, où il a sa place.
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Le profileur : même dépôt, même commit, une image à part. Il ne sert
      # rien et n'ouvre aucun port ; c'est nginx, à côté, qui sert ce qu'il
      # écrit.
      #
      # **Il est publié tant que la pile en service en dépend**, et pas un jour
      # de plus. Le serveur ci-dessous fait son travail sans scruter de dossier,
      # mais la production tourne encore sur l'ancienne pile : cesser de publier
      # cette image aujourd'hui la laisserait sans profil mesuré au premier
      # redéploiement.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.profileur
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-profileur.outputs.tags }}
          labels: ${{ steps.meta-profileur.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Le serveur, qui remplacera les deux images ci-dessus ---------------
      - id: meta-serveur
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}-serveur
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.serveur
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-serveur.outputs.tags }}
          labels: ${{ steps.meta-serveur.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
