# Construit l'image et la publie sur le registre de conteneurs GitHub.
#
# Le NAS n'a alors plus rien à construire ni à recevoir : Portainer tire une
# image déjà prête. Mettre à jour tient en un « git push » suivi d'un bouton
# dans l'interface de Portainer.
#
# Trois étiquettes, trois usages :
#   latest    la production, poussée depuis `main` seulement
#   develop   l'intégration, pour essayer sur le NAS avant de sortir une version
#   vX.Y.Z    une version figée, poussée par le tag correspondant
# Une pile Portainer qui tire `develop` sur un autre port permet de vérifier un
# lot en conditions réelles sans toucher à celle qui sert dans la voiture.

name: Image Docker

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Vérifie le code avant de publier quoi que ce soit : une image qui ne
      # compile pas n'a rien à faire dans le registre.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Les deux architectures que l'on rencontre sur un NAS. La
          # construction reste native grâce à BUILDPLATFORM dans le Dockerfile.
          platforms: linux/amd64,linux/arm64
          # Les écrans de banc, dans l'image d'intégration seulement : c'est
          # celle qu'on essaie dans la voiture, et c'est garé qu'on règle un
          # timbre. La production n'en veut pas.
          build-args: |
            BENCH=${{ github.ref == 'refs/heads/develop' && '1' || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
