# Pile d'essai, sur l'intégration. À coller dans Portainer, à côté de celle de
# production : Stacks > Add stack > Web editor, nommer la pile `speed-develop`.
#
# Elle tire l'étiquette `:develop`, publiée à chaque poussée sur la branche du
# même nom — donc à chaque lot fusionné, avant qu'il devienne une version. C'est
# ce qui permet d'essayer en voiture ce qui n'est pas encore sorti, sans toucher
# à l'application qui sert au quotidien.
#
# Trois choses la distinguent de la pile de production, et les trois comptent :
#
#   - un **autre nom de conteneur**, sans quoi Portainer refuserait de la
#     déployer à côté de l'autre ;
#   - un **autre port**, pour la même raison ;
#   - une **autre adresse** dans le proxy inversé de DSM. Ce n'est pas du
#     confort : le GPS, le verrou d'écran et le service worker n'existent que
#     dans un « contexte sécurisé ». En HTTP simple, la page s'affiche et la
#     localisation est refusée sans message. Il faut donc du HTTPS, donc un nom
#     d'hôte, donc une entrée de proxy — voir le README.
#
# **Les deux piles ne partagent plus rien**, depuis le 12 septembre 2026 : celle-ci
# lit et écrit dans `speed-dev/`, copié depuis `speed/`. Elles partageaient tout
# auparavant, ce qui coûtait plus cher que la recopie qu'on économisait : un
# trajet fait sur l'intégration entrait dans le profil mesuré de la production, et
# le profileur de chaque pile relisait les trajets de l'autre. Rien ne le
# signalait, et la mesure en était faussée.
#
# Une banque sonore est donc à déposer dans les deux dossiers, ou à recopier.
#
# Elles ne partagent pas davantage les profils enregistrés dans le navigateur : le
# stockage local appartient à une adresse. Les réglages trouvés sur l'une ne
# suivent pas sur l'autre — le dossier `profiles/` servait de passerelle, il ne le
# fait plus ; reste l'export de profil par lien.

services:
  sound-of-speed-develop:
    image: ghcr.io/davidp57/sound-of-speed:develop
    container_name: sound-of-speed-develop
    restart: unless-stopped
    # Portainer ne retire pas de lui-même une image devenue obsolète : après une
    # poussée sur `develop`, il faut redéployer la pile en cochant
    # « Re-pull image » pour obtenir la version nouvelle.
    ports:
      # Un port de plus que la production. C'est le proxy inversé de DSM qui
      # l'expose en HTTPS.
      - "8089:80"
    volumes:
      # Mêmes échantillons que la production : ils ne dépendent pas du code.
      - /volume1/docker/sound-of-speed-dev/audio:/usr/share/nginx/html/audio:ro
      # Profils partagés entre appareils, déposés avec File Station.
      #
      # Le dossier doit **exister**, même vide : Docker sous DSM ne crée pas un
      # point de montage absent, il refuse de démarrer le conteneur. Le
      # commenter est l'autre issue, au prix de la bibliothèque de profils.
      #
      # Le même dossier que la production : c'est ce qui permet de comparer les
      # deux piles sur les mêmes réglages.
      #
      # **En lecture-écriture** depuis le lot REMONTEE : un profil réglé dans la
      # voiture y remonte tout seul, et c'est ce dossier que la bibliothèque lit.
      - /volume1/docker/sound-of-speed-dev/profiles:/usr/share/nginx/html/profiles
      # Dépôt des traces enregistrées en roulant. **En lecture-écriture** : le
      # navigateur de la voiture refuse tout téléchargement, c'est par là que les
      # traces en sortent. Le dossier doit exister, comme celui des profils, et
      # le dépôt exige le fichier de mots de passe ci-dessous.
      - /volume1/docker/sound-of-speed-dev/traces:/usr/share/nginx/html/traces
      # Ce que le profileur a mesuré de la vraie voiture. **En lecture seule**
      # de ce côté : c'est l'autre conteneur qui écrit, celui-ci ne fait que
      # servir le fichier. Le dossier doit exister, comme les autres.
      - /volume1/docker/sound-of-speed-dev/mesure-voiture:/usr/share/nginx/html/mesure-voiture:ro
      # Journal de bord, déposé tout seul en roulant. **En lecture-écriture**,
      # pour la même raison, et dans un dossier séparé : celui des traces est
      # servi en index JSON, et c'est cet index que l'application télécharge pour
      # les lister — une tranche de journal toutes les cinq minutes l'alourdirait
      # à chaque sortie. Rien n'y est déposé tant que le journal n'a pas été
      # accepté dans l'écran de configuration.
      - /volume1/docker/sound-of-speed-dev/journal:/usr/share/nginx/html/journal
      # Relevés de mesure, déposés par la sonde et par l'application. **En
      # lecture-écriture**, dans un dossier à part : ces fichiers se lisent un par
      # un, à la main, et se noieraient parmi les tranches de journal.
      - /volume1/docker/sound-of-speed-dev/mesures:/usr/share/nginx/html/mesures
      # Fichier de mots de passe. À décommenter dans **deux** cas, qui sont
      # indépendants :
      #
      #  - pour tout ce qui remonte depuis la voiture — traces, journal, relevés
      #    de mesure, profils. Les quatre emplacements de docker/nginx.conf
      #    exigent toujours de s'annoncer en écriture, et il n'y a rien d'autre à
      #    décommenter que cette ligne ;
      #  - pour protéger le site entier, si l'adresse est exposée hors du réseau
      #    local. Il faut alors aussi décommenter les deux lignes auth_basic de
      #    docker/nginx.conf.
      #
      # Le fichier se produit avec `npm run htpasswd`, sans Docker.
      # - /volume1/docker/sound-of-speed-dev/htpasswd:/etc/nginx/htpasswd:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Le profileur : il relit les traces déposées et en tire le profil de la vraie
  # voiture. Rien à exposer — il n'ouvre aucun port et ne sert rien ; c'est nginx,
  # au-dessus, qui sert ce qu'il écrit.
  #
  # Il vient du **même commit** que l'application : c'est ce qui garantit qu'ils
  # calculent la même chose. Redéployer l'une sans l'autre les ferait diverger.
  sound-of-speed-profileur-develop:
    image: ghcr.io/davidp57/sound-of-speed-profileur:develop
    container_name: sound-of-speed-profileur-develop
    restart: unless-stopped
    volumes:
      # Les traces, en **lecture seule** : il les lit, il n'y touche pas.
      - /volume1/docker/sound-of-speed-dev/traces:/data/traces:ro
      # La mesure de la voiture, en lecture-écriture : c'est là qu'il dépose ce
      # qu'il a mesuré, dans le dossier que l'application sert déjà.
      - /volume1/docker/sound-of-speed-dev/mesure-voiture:/data/mesure-voiture
    environment:
      # Le relevé du dossier. Cinq secondes : une tranche arrive toutes les cinq
      # minutes en roulant, et lire une liste de noms ne coûte rien.
      SPEED_SCAN_MS: "5000"
