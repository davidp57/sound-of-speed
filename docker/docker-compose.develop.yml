# Pile d'essai, sur l'intégration. À coller dans Portainer, à côté de celle de
# production : Stacks > Add stack > Web editor, nommer la pile `speed-develop`.
#
# Elle tire l'étiquette `:develop`, publiée à chaque poussée sur la branche du
# même nom — donc à chaque lot fusionné, avant qu'il devienne une version. C'est
# ce qui permet d'essayer en voiture ce qui n'est pas encore sorti, sans toucher
# à l'application qui sert au quotidien.
#
# Trois choses la distinguent de la pile de production, et les trois comptent :
#
#   - un **autre nom de conteneur**, sans quoi Portainer refuserait de la
#     déployer à côté de l'autre ;
#   - un **autre port**, pour la même raison ;
#   - une **autre adresse** dans le proxy inversé de DSM. Ce n'est pas du
#     confort : le GPS, le verrou d'écran et le service worker n'existent que
#     dans un « contexte sécurisé ». En HTTP simple, la page s'affiche et la
#     localisation est refusée sans message. Il faut donc du HTTPS, donc un nom
#     d'hôte, donc une entrée de proxy — voir le README.
#
# Les deux piles partagent les échantillons et les profils, en lecture seule :
# rien à recopier, et une banque sonore déposée une fois sert aux deux.
#
# En revanche elles ne partagent **pas** les profils enregistrés dans le
# navigateur : le stockage local appartient à une adresse. Les réglages trouvés
# sur l'une ne suivent pas sur l'autre — c'est le dossier `profiles/` partagé qui
# sert de passerelle, ou l'export de profil par lien.

services:
  speed-develop:
    image: ghcr.io/davidp57/speed:develop
    container_name: speed-develop
    restart: unless-stopped
    # Portainer ne retire pas de lui-même une image devenue obsolète : après une
    # poussée sur `develop`, il faut redéployer la pile en cochant
    # « Re-pull image » pour obtenir la version nouvelle.
    ports:
      # Un port de plus que la production. C'est le proxy inversé de DSM qui
      # l'expose en HTTPS.
      - "8089:80"
    volumes:
      # Mêmes échantillons que la production : ils ne dépendent pas du code.
      - /volume1/docker/speed/audio:/usr/share/nginx/html/audio:ro
      # Profils partagés entre appareils, déposés avec File Station.
      #
      # Le dossier doit **exister**, même vide : Docker sous DSM ne crée pas un
      # point de montage absent, il refuse de démarrer le conteneur. Le
      # commenter est l'autre issue, au prix de la bibliothèque de profils.
      #
      # Le même dossier que la production : c'est ce qui permet de comparer les
      # deux piles sur les mêmes réglages.
      - /volume1/docker/speed/profiles:/usr/share/nginx/html/profiles:ro
      # Dépôt des traces enregistrées en roulant. **En lecture-écriture** : le
      # navigateur de la voiture refuse tout téléchargement, c'est par là que les
      # traces en sortent. Le dossier doit exister, comme celui des profils, et
      # le dépôt exige le fichier de mots de passe ci-dessous.
      - /volume1/docker/speed/traces:/usr/share/nginx/html/traces
      # Journal de bord, déposé tout seul en roulant. **En lecture-écriture**,
      # pour la même raison, et dans un dossier séparé : celui des traces est
      # servi en index JSON, et c'est cet index que l'application télécharge pour
      # les lister — une tranche de journal toutes les cinq minutes l'alourdirait
      # à chaque sortie. Rien n'y est déposé tant que le journal n'a pas été
      # accepté dans l'écran de configuration.
      - /volume1/docker/speed/journal:/usr/share/nginx/html/journal
      # Fichier de mots de passe. À décommenter dans **deux** cas, qui sont
      # indépendants :
      #
      #  - pour déposer une trace depuis la voiture. L'emplacement /traces/ de
      #    docker/nginx.conf exige toujours de s'annoncer, et il n'y a rien
      #    d'autre à décommenter que cette ligne ;
      #  - pour protéger le site entier, si l'adresse est exposée hors du réseau
      #    local. Il faut alors aussi décommenter les deux lignes auth_basic de
      #    docker/nginx.conf.
      #
      # Le fichier se produit avec `npm run htpasswd`, sans Docker.
      # - /volume1/docker/speed/htpasswd:/etc/nginx/htpasswd:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
