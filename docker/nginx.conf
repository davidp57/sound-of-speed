# Service des fichiers statiques, derrière le proxy inversé du NAS.
#
# Le proxy Synology termine le TLS et transmet en clair sur le réseau local :
# nginx n'écoute donc qu'en HTTP, et ne connaît rien aux certificats.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression des ressources textuelles seulement. Recompresser du FLAC ou
    # du WAV coûte du processeur pour ne rien gagner.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Le proxy inversé peut être configuré pour ne pas transmettre la taille
    # réelle des corps ; on la laisse libre, les échantillons sont volumineux.
    client_max_body_size 0;

    # --- Authentification (optionnelle) -----------------------------------
    #
    # À activer si le service est exposé hors du réseau local. Sans elle,
    # l'adresse est publique et les échantillons avec elle.
    #
    # Créer le fichier avec :
    #   docker run --rm httpd:alpine htpasswd -nbB david "motdepasse" > htpasswd
    #
    # auth_basic           "Speed";
    # auth_basic_user_file /etc/nginx/htpasswd;

    # --- Politique de cache -----------------------------------------------

    # Les noms des ressources produites par Vite contiennent une empreinte du
    # contenu : elles ne changent jamais sans changer de nom, donc on peut les
    # garder indéfiniment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Les échantillons, eux, se remplacent sans changer de nom. Une semaine de
    # cache avec revalidation évite de retélécharger plusieurs mégaoctets à
    # chaque démarrage tout en laissant un changement de banque se propager.
    location /audio/ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";

        # nginx ne connaît pas le FLAC dans sa table par défaut. Sans
        # conséquence pour la lecture — le décodage travaille sur les octets
        # bruts — mais autant annoncer le bon type.
        location ~ \.flac$ {
            default_type audio/flac;
        }
    }

    # Bibliothèque de profils déposés sur le NAS.
    #
    # nginx sait rendre le contenu d'un dossier en JSON : c'est tout ce qu'il
    # faut pour que l'application découvre les profils qu'on y dépose, sans
    # service ni base de données. Le dossier est facultatif — son absence rend un
    # 404 que l'application traite comme une liste vide.
    location /profiles/ {
        autoindex on;
        autoindex_format json;
        expires -1;
        add_header Cache-Control "no-store";
    }

    # Dépôt des traces enregistrées en roulant.
    #
    # Le navigateur de la voiture refuse tout téléchargement : rien ne sort donc
    # d'une session d'enregistrement, alors que c'est précisément là que les
    # traces naissent et qu'elles ne servent qu'ailleurs — au poste de travail,
    # pour rejouer un trajet et régler sans reprendre la route.
    #
    # nginx sait recevoir un fichier, et cela n'ajoute aucun service à
    # maintenir : c'est la contrainte du projet depuis le début. Vérifié à la
    # source, le paquet Alpine officiel de nginx — celui qu'installe l'image dont
    # hérite la nôtre — est compilé avec `--with-http_dav_module`, et n'exclut
    # aucun module.
    #
    # Seul PUT est ouvert. Ni DELETE ni MKCOL : une trace déposée ne s'effface
    # pas depuis le réseau, et les dossiers se créent avec File Station.
    location /traces/ {
        # Lecture : la liste en JSON, comme la bibliothèque de profils.
        autoindex on;
        autoindex_format json;
        expires -1;
        add_header Cache-Control "no-store";

        # Écriture : toujours authentifiée, même quand l'authentification
        # générale ci-dessus reste commentée. Un dossier ouvert en écriture sur
        # une adresse joignable de l'extérieur est une invitation, et le proxy
        # inversé du NAS ne suffit pas à l'en protéger.
        #
        # Le fichier de mots de passe est donc **obligatoire** pour déposer :
        # `npm run htpasswd` le produit sans Docker.
        limit_except GET HEAD {
            auth_basic           "Speed — dépôt";
            auth_basic_user_file /etc/nginx/htpasswd;
        }

        dav_methods PUT;
        dav_access  user:rw group:rw all:r;

        # Une trace pèse de quelques dizaines de kilo-octets à quelques
        # mégaoctets. La borne est là pour qu'un dossier ouvert en écriture ne
        # puisse pas servir à déposer n'importe quoi, la taille des corps étant
        # laissée libre ailleurs pour les échantillons.
        client_max_body_size 64m;
    }

    # Dépôt du journal de bord.
    #
    # Même mécanisme que les traces, et un dossier séparé : celui des traces est
    # servi en index JSON, et c'est cet index que l'application télécharge pour
    # les lister. Y verser une tranche de journal toutes les cinq minutes
    # alourdirait cette liste à chaque sortie.
    #
    # Le dossier se crée avec File Station, comme les autres : ni MKCOL ni
    # DELETE ne sont ouverts ici non plus. Une conséquence assumée — l'application
    # ne peut pas faire le ménage de ses propres journaux, ce qui est bien : un
    # témoin qui peut effacer ses notes est un mauvais témoin.
    location /journal/ {
        autoindex on;
        autoindex_format json;
        expires -1;
        add_header Cache-Control "no-store";

        limit_except GET HEAD {
            auth_basic           "Speed — journal";
            auth_basic_user_file /etc/nginx/htpasswd;
        }

        dav_methods PUT;
        dav_access  user:rw group:rw all:r;

        # Une tranche pèse quelques dizaines de kilo-octets. La borne est basse
        # exprès : elle dit ce qu'on attend, et un dossier ouvert en écriture sur
        # une adresse joignable ne doit pas servir à déposer autre chose.
        client_max_body_size 4m;
    }

    # La page d'entrée doit toujours être revalidée : c'est elle qui référence
    # les ressources empreintes, donc elle seule fait basculer sur une version.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # En-têtes de base. Pas de politique de sécurité du contenu ici : elle
    # casserait l'AudioWorklet, chargé depuis une URL d'objet locale.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
