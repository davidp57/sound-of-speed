# Service des fichiers statiques, derrière le proxy inversé du NAS.
#
# Le proxy Synology termine le TLS et transmet en clair sur le réseau local :
# nginx n'écoute donc qu'en HTTP, et ne connaît rien aux certificats.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression des ressources textuelles seulement. Recompresser du FLAC ou
    # du WAV coûte du processeur pour ne rien gagner.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Le proxy inversé peut être configuré pour ne pas transmettre la taille
    # réelle des corps ; on la laisse libre, les échantillons sont volumineux.
    client_max_body_size 0;

    # --- Authentification (optionnelle) -----------------------------------
    #
    # À activer si le service est exposé hors du réseau local. Sans elle,
    # l'adresse est publique et les échantillons avec elle.
    #
    # Créer le fichier avec :
    #   docker run --rm httpd:alpine htpasswd -nbB david "motdepasse" > htpasswd
    #
    # auth_basic           "Speed";
    # auth_basic_user_file /etc/nginx/htpasswd;

    # --- Politique de cache -----------------------------------------------

    # Les noms des ressources produites par Vite contiennent une empreinte du
    # contenu : elles ne changent jamais sans changer de nom, donc on peut les
    # garder indéfiniment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Les échantillons, eux, se remplacent sans changer de nom. Une semaine de
    # cache avec revalidation évite de retélécharger plusieurs mégaoctets à
    # chaque démarrage tout en laissant un changement de banque se propager.
    location /audio/ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";

        # nginx ne connaît pas le FLAC dans sa table par défaut. Sans
        # conséquence pour la lecture — le décodage travaille sur les octets
        # bruts — mais autant annoncer le bon type.
        location ~ \.flac$ {
            default_type audio/flac;
        }

        # Listage des banques, pour que l'application les découvre au lieu de
        # faire taper un nom de dossier en aveugle. La règle ne prend que les
        # adresses qui se terminent par une barre, donc les dossiers : un
        # échantillon n'est jamais listé, il est servi.
        #
        # Aucune authentification, à la différence des quatre dossiers de dépôt :
        # les échantillons se chargent sans compte, sinon aucun son ne sortirait.
        # Lister ne montre donc que ce qui est déjà servi.
        #
        # Le cache d'une semaine du bloc parent vaut pour les échantillons, qui
        # se remplacent sans changer de nom. Il ne vaut pas pour le listage :
        # une banque déposée doit apparaître tout de suite, pas la semaine
        # suivante.
        location ~ ^/audio/(.*/)?$ {
            autoindex on;
            autoindex_format json;
            expires -1;
            add_header Cache-Control "no-store";
        }
    }

    # Bibliothèque de profils déposés sur le NAS.
    #
    # nginx sait rendre le contenu d'un dossier en JSON : c'est tout ce qu'il
    # faut pour que l'application découvre les profils qu'on y dépose, sans
    # service ni base de données. Le dossier est facultatif — son absence rend un
    # 404 que l'application traite comme une liste vide.
    #
    # L'écriture y est ouverte depuis le lot REMONTEE : un profil réglé dans la
    # voiture remonte ici, et c'est bien ici qu'il doit atterrir, puisque c'est
    # ce dossier que la bibliothèque lit. Le nom du fichier étant tiré de
    # l'identifiant du profil, un dépôt remplace sa propre version précédente au
    # lieu d'accumuler des copies.
    #
    # Le volume correspondant doit alors être monté en lecture-écriture : voir
    # docker/docker-compose.yml.
    location /profiles/ {
        autoindex on;
        autoindex_format json;
        expires -1;
        add_header Cache-Control "no-store";

        auth_basic           "Speed — profils";
        auth_basic_user_file /etc/nginx/htpasswd;

        dav_methods PUT;
        dav_access  user:rw group:rw all:r;

        # Un profil pèse quelques kilo-octets. La borne dit ce qu'on attend.
        client_max_body_size 1m;
    }

    # Ce que le profileur a mesuré de la vraie voiture.
    #
    # Un seul fichier, `profil-voiture.json`, écrit par le conteneur
    # `speed-profileur` et lu par l'application au démarrage. **En lecture
    # seule** : rien ne remonte ici depuis la voiture, contrairement aux quatre
    # emplacements qui suivent.
    #
    # Il a manqué jusqu'au 11 septembre 2026, et c'est ce qui a fait attendre
    # David au bureau devant un bandeau qui n'est jamais venu : sans cet
    # emplacement, la requête tombait dans le `location /` ci-dessous, dont le
    # `try_files … /index.html` répond **200 avec la page d'accueil**. Le code
    # voyait donc une réponse valable et échouait à la lire, en silence.
    #
    # Le dossier est facultatif — son absence rend un 404, que l'application
    # traite comme « pas encore de mesure ».
    location /profils/ {
        expires -1;
        add_header Cache-Control "no-store";
    }

    # Dépôt des traces enregistrées en roulant.
    #
    # Le navigateur de la voiture refuse tout téléchargement : rien ne sort donc
    # d'une session d'enregistrement, alors que c'est précisément là que les
    # traces naissent et qu'elles ne servent qu'ailleurs — au poste de travail,
    # pour rejouer un trajet et régler sans reprendre la route.
    #
    # nginx sait recevoir un fichier, et cela n'ajoute aucun service à
    # maintenir : c'est la contrainte du projet depuis le début. Vérifié à la
    # source, le paquet Alpine officiel de nginx — celui qu'installe l'image dont
    # hérite la nôtre — est compilé avec `--with-http_dav_module`, et n'exclut
    # aucun module.
    #
    # Seul PUT est ouvert. Ni DELETE ni MKCOL : une trace déposée ne s'effface
    # pas depuis le réseau, et les dossiers se créent avec File Station.
    location /traces/ {
        # Lecture : la liste en JSON, comme la bibliothèque de profils.
        autoindex on;
        autoindex_format json;
        expires -1;
        add_header Cache-Control "no-store";

        # Lecture **et** écriture authentifiées, même quand l'authentification
        # générale ci-dessus reste commentée.
        #
        # L'écriture l'a toujours été : un dossier ouvert en écriture sur une
        # adresse joignable de l'extérieur est une invitation, et le proxy
        # inversé du NAS ne suffit pas à l'en protéger.
        #
        # La lecture ne l'était pas, et c'était un trou : l'adresse du site est
        # publique — la voiture n'est pas sur le réseau local —, si bien que
        # qui la connaissait pouvait lister les trajets et les télécharger. Le
        # journal porte en plus des positions dès le cran étendu. David, le
        # 6 septembre 2026 : « c'est accessible de l'extérieur, bien sûr ; ferme
        # tout en utilisant le mot de passe du dépôt ».
        #
        # Le fichier de mots de passe est donc **obligatoire** pour lire comme
        # pour déposer : `npm run htpasswd` le produit sans Docker.
        auth_basic           "Speed — dépôt";
        auth_basic_user_file /etc/nginx/htpasswd;

        dav_methods PUT;
        dav_access  user:rw group:rw all:r;

        # Une trace pèse de quelques dizaines de kilo-octets à quelques
        # mégaoctets. La borne est là pour qu'un dossier ouvert en écriture ne
        # puisse pas servir à déposer n'importe quoi, la taille des corps étant
        # laissée libre ailleurs pour les échantillons.
        client_max_body_size 64m;
    }

    # Dépôt du journal de bord.
    #
    # Même mécanisme que les traces, et un dossier séparé : celui des traces est
    # servi en index JSON, et c'est cet index que l'application télécharge pour
    # les lister. Y verser une tranche de journal toutes les cinq minutes
    # alourdirait cette liste à chaque sortie.
    #
    # Le dossier se crée avec File Station, comme les autres : ni MKCOL ni
    # DELETE ne sont ouverts ici non plus. Une conséquence assumée — l'application
    # ne peut pas faire le ménage de ses propres journaux, ce qui est bien : un
    # témoin qui peut effacer ses notes est un mauvais témoin.
    location /journal/ {
        autoindex on;
        autoindex_format json;
        expires -1;
        add_header Cache-Control "no-store";

        auth_basic           "Speed — journal";
        auth_basic_user_file /etc/nginx/htpasswd;

        dav_methods PUT;
        dav_access  user:rw group:rw all:r;

        # Une tranche pèse quelques dizaines de kilo-octets. La borne est basse
        # exprès : elle dit ce qu'on attend, et un dossier ouvert en écriture sur
        # une adresse joignable ne doit pas servir à déposer autre chose.
        client_max_body_size 4m;
    }

    # Dépôt des relevés de mesure.
    #
    # La sonde se lance dans la voiture et affiche un chiffre ; il n'en sortait
    # pas. Le navigateur de bord ne télécharge rien et son presse-papiers ne mène
    # nulle part, si bien qu'un relevé pris là-bas devait être recopié à la main
    # — quand il pouvait l'être.
    #
    # Un dossier à part plutôt que celui du journal : ces fichiers se lisent un
    # par un, à la main, et se noieraient parmi les tranches déposées toutes les
    # cinq minutes.
    location /mesures/ {
        autoindex on;
        autoindex_format json;
        expires -1;
        add_header Cache-Control "no-store";

        auth_basic           "Speed — mesures";
        auth_basic_user_file /etc/nginx/htpasswd;

        dav_methods PUT;
        dav_access  user:rw group:rw all:r;

        # Un relevé pèse quelques kilo-octets.
        client_max_body_size 1m;
    }

    # Sonde de mesure — voir .backlog/SYNTHESE/tickets/01-la-sonde.md.
    #
    # Une page autonome, hors de l'application, que David ouvre dans la voiture
    # pour chronométrer le cœur d'engine-sim compilé en WebAssembly. Elle vit
    # dans `public/sonde/`, que la construction Vite recopie telle quelle dans
    # `dist/` : rien à ajouter au Dockerfile.
    #
    # Ce bloc existe pour une seule raison : sans lui, `/sonde/` tomberait dans
    # le `location /` ci-dessous, dont le `try_files … /index.html` renvoie
    # l'application dès qu'un fichier manque. Une adresse mal tapée ouvrirait
    # donc l'application au lieu de dire qu'elle n'existe pas — le pire des cas
    # dans une voiture, où il n'y a ni console ni outils pour comprendre.
    #
    # Aucune authentification déclarée ici : le bloc hérite de celle du serveur,
    # et la sonde est donc protégée exactement comme le reste du site.
    location /sonde/ {
        try_files $uri $uri/ =404;

        # La sonde se corrige entre deux essais, et le service worker en garde
        # une copie. `expires -1` annonce `Cache-Control: no-cache` : le
        # navigateur revalide à chaque fois, ce qui coûte un 304 et évite de
        # mesurer une version périmée en croyant mesurer la dernière.
        expires -1;

        # Le binaire WebAssembly compresse bien, et il transite jusqu'à la
        # voiture. La liste du serveur ne porte que des types textuels ; la
        # redéfinir ici plutôt que là-bas garde la compression du reste du site
        # inchangée.
        gzip_types application/wasm application/javascript;

        # `WebAssembly.instantiateStreaming` refuse tout ce qui n'est pas
        # annoncé `application/wasm`, et échoue alors sans rien expliquer.
        # `default_type` ne sert que si la table des types de nginx ignore
        # l'extension : quand elle la connaît, le résultat est le même.
        location ~ \.wasm$ {
            default_type application/wasm;
        }

        # La table des types de nginx ne connaît pas `.mjs` : `probe.mjs`
        # partait donc en `application/octet-stream`, mesuré sur l'image du
        # projet. Un navigateur refuse d'exécuter un module servi sous ce
        # type-là, et l'import échoue — le son synthétisé s'arrêtait sur une
        # erreur juste après « construction du moteur », et la sonde retombait
        # sans le dire sur son bouchon. Le même type que `engine.js`, son
        # voisin, pour que la compression déjà déclarée s'y applique.
        location ~ \.mjs$ {
            default_type application/javascript;
        }
    }

    # La page d'entrée doit toujours être revalidée : c'est elle qui référence
    # les ressources empreintes, donc elle seule fait basculer sur une version.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # En-têtes de base. Pas de politique de sécurité du contenu ici : elle
    # casserait l'AudioWorklet, chargé depuis une URL d'objet locale.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
