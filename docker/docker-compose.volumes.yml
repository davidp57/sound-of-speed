# Variante sans registre : nginx officiel, et tout le contenu par volumes.
#
# La pile principale (docker-compose.yml) tire une image publiée par GitHub et ne
# demande aucune recopie : c'est elle qu'il faut utiliser. Celle-ci reste utile
# dans deux cas — essayer une modification sans attendre la chaîne
# d'intégration, ou dépanner quand le registre est inaccessible.
#
# Elle suppose que le contenu de `npm run build` a été recopié dans
# /volume1/docker/speed/dist, ce que fait `npm run deploy`, et que
# docker/nginx.conf a été déposé au même endroit.

services:
  speed:
    image: nginx:alpine
    container_name: speed
    restart: unless-stopped
    ports:
      # Port interne au NAS. C'est le proxy inversé de DSM qui l'expose en HTTPS.
      - "8088:80"
    volumes:
      - /volume1/docker/speed/dist:/usr/share/nginx/html:ro
      - /volume1/docker/speed/audio:/usr/share/nginx/html/audio:ro
      - /volume1/docker/speed/profiles:/usr/share/nginx/html/profiles:ro
      # Dépôt des traces enregistrées en roulant. **En lecture-écriture** : le
      # navigateur de la voiture refuse tout téléchargement, c'est par là que les
      # traces en sortent. Le dossier doit exister, comme celui des profils, et
      # le dépôt exige le fichier de mots de passe ci-dessous.
      - /volume1/docker/speed/traces:/usr/share/nginx/html/traces
      - /volume1/docker/speed/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Fichier de mots de passe. À décommenter dans **deux** cas, qui sont
      # indépendants :
      #
      #  - pour déposer une trace depuis la voiture. L'emplacement /traces/ de
      #    docker/nginx.conf exige toujours de s'annoncer, et il n'y a rien
      #    d'autre à décommenter que cette ligne ;
      #  - pour protéger le site entier, si l'adresse est exposée hors du réseau
      #    local. Il faut alors aussi décommenter les deux lignes auth_basic de
      #    docker/nginx.conf.
      #
      # Le fichier se produit avec `npm run htpasswd`, sans Docker.
      # - /volume1/docker/speed/htpasswd:/etc/nginx/htpasswd:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
