# La pile du serveur TypeScript : **un seul service**.
#
# Elle remplace les deux conteneurs d'avant — celui qui servait des fichiers et
# celui qui relisait un dossier — et elle prend **la place de la pile
# d'intégration**, port compris : c'est celle-là qu'elle rend inutile.
#
# La production, elle, n'est pas touchée. Elle continue de servir dans la voiture
# et fait repli, le temps que le neuf convainque.
#
# À coller dans Portainer : Stacks > Add stack > Web editor. Les variables se
# saisissent dans l'écran de la pile, section « Environment variables ».
#
# Ce qu'il faut préparer avant de démarrer, et rien d'autre :
#
#   - un dossier de données, avec un sous-dossier `audio/` si vous avez des
#     banques enregistrées à déposer.
#
# Il n'y a plus de fichier de mots de passe : chaque appareil a son compte, créé
# tout seul au premier lancement, et c'est lui qui ouvre les dépôts.
#
# La base se crée toute seule au premier démarrage, et se met à jour à chaque
# suivant. Il n'y a pas d'étape de migration à lancer à la main.

services:
  sound-of-speed-serveur:
    image: ghcr.io/davidp57/sound-of-speed-serveur:${SPEED_TAG:-develop}
    container_name: sound-of-speed-serveur
    restart: unless-stopped
    ports:
      # **Le port de la pile d'intégration**, et non un troisième.
      #
      # Ce serveur ne s'ajoute pas à cette pile-là : il la remplace. Elle fait
      # tourner deux conteneurs — celui qui sert des fichiers et celui qui relit
      # un dossier — dont celui-ci fait tout le travail. Les garder côte à côte
      # sur deux ports reviendrait à essayer deux choses en croyant en essayer
      # une, et à se tromper sur ce qu'on regarde.
      #
      # **Arrêter la pile d'intégration avant de démarrer celle-ci** : deux
      # services ne peuvent pas écouter le même port, et le second refuserait de
      # démarrer. Ce que cette pile-là avait déposé reste sur le disque du NAS,
      # dans son propre dossier — rien n'est perdu, et rien n'est repris non
      # plus : la reprise des données est le lot MIGRER.
      #
      # La production, elle, garde son port et continue de servir dans la
      # voiture. C'est le proxy inversé de DSM qui expose celui-ci en HTTPS —
      # sans quoi l'application s'affiche mais refuse le GPS, sans rien dire.
      - "${SPEED_PORT:-8089}:80"
    volumes:
      # Tout ce que le serveur garde tient dans ce dossier : la base, et les
      # banques d'échantillons qu'on y dépose. Le reste — profils, traces,
      # journal, relevés — vit **dans la base**, et non plus dans cinq dossiers.
      #
      # Le dossier doit exister avant de démarrer : Docker ne crée pas un point
      # de montage absent, il refuse de démarrer le conteneur, ce qui se lit
      # comme une panne alors que c'est un dossier manquant.
      - ${SPEED_DATA:-/volume1/docker/sound-of-speed-serveur}:/data
      # Les anciens dossiers du serveur de fichiers, **en lecture seule**.
      #
      # À décommenter le temps de la reprise, avec la variable SPEED_REPRISE
      # ci-dessous, puis à retirer une fois le décompte vérifié dans le journal
      # du conteneur. Le « :ro » n'est pas décoratif : c'est lui qui garantit
      # qu'une reprise ne peut rien abîmer à la source, et non une intention
      # écrite dans le code.
      # - /volume1/docker/sound-of-speed:/ancien:ro
    environment:
      # L'adresse **publique** de cette pile, celle que le proxy inversé de DSM
      # expose — pas le port local. Deux piles, deux adresses :
      # `https://speed.<votre-nom>.synology.me` pour la production,
      # `https://speed-dev.<votre-nom>.synology.me` pour l'intégration.
      #
      # Sans elle, la bibliothèque d'identité déduit son adresse de chaque
      # requête et le signale à chaque démarrage. C'est sans conséquence
      # aujourd'hui, mais le jour où un fournisseur d'identité tiers doit
      # revenir sur le site, c'est cette adresse-là qu'il lui faut — et derrière
      # un proxy inversé, elle ne se devine pas.
      SPEED_URL: ${SPEED_URL:-}
      # Les comptes tenus ailleurs — Tesla, Google, Apple.
      #
      # **Les deux d'un fournisseur, ou aucune.** La moitié d'une paire ne monte
      # rien, et une variable laissée vide vaut absente : c'est ce qu'on obtient
      # ici quand on ne la saisit pas dans l'écran de la pile, et c'est voulu.
      #
      # Elles sont **déclarées ici même quand on ne s'en sert pas** : une
      # variable saisie dans Portainer et absente de ce bloc n'arrive jamais au
      # conteneur — Portainer la remplace dans ce fichier, il ne l'injecte pas.
      #
      # Ce qu'il faut faire chez chacun des trois pour obtenir ces identifiants
      # est décrit dans `.backlog/COMPTES/tickets/12-un-compte-tiers.md`. Et
      # SPEED_URL cesse d'être facultative dès qu'il y en a un : le fournisseur
      # doit revenir sur le site, et l'adresse de retour qu'on déclare chez lui
      # est `<SPEED_URL>/api/auth/callback/<fournisseur>`.
      SPEED_OAUTH_TESLA_ID: ${SPEED_OAUTH_TESLA_ID:-}
      SPEED_OAUTH_TESLA_SECRET: ${SPEED_OAUTH_TESLA_SECRET:-}
      SPEED_OAUTH_GOOGLE_ID: ${SPEED_OAUTH_GOOGLE_ID:-}
      SPEED_OAUTH_GOOGLE_SECRET: ${SPEED_OAUTH_GOOGLE_SECRET:-}
      SPEED_OAUTH_APPLE_ID: ${SPEED_OAUTH_APPLE_ID:-}
      SPEED_OAUTH_APPLE_SECRET: ${SPEED_OAUTH_APPLE_SECRET:-}
      # Le dossier à reprendre. Sans elle, le serveur ne cherche rien.
      #
      # La reprise se joue au démarrage, comme les migrations, et n'écrit rien
      # de ce que la base porte déjà : la relancer ne fait pas de doublon. Le
      # décompte s'imprime dans le journal du conteneur — c'est là qu'on lit ce
      # qui est entré, ce qui était déjà là, et ce qui a été écarté.
      # SPEED_REPRISE: /ancien
