# Pile à coller dans Portainer : Stacks > Add stack > Web editor.
#
# L'image est construite et publiée par GitHub à chaque poussée sur `main`. Le
# NAS ne construit rien et ne reçoit aucun fichier : il tire une image prête.
#
# Pour essayer l'intégration avant qu'elle devienne une version, dupliquer cette
# pile sous un autre nom, avec l'étiquette `:develop` et un autre port.
# Mettre à jour tient alors à un bouton dans Portainer, sans terminal.
#
# Le registre étant privé comme le dépôt, Portainer doit s'y authentifier une
# fois pour toutes : voir la section « Installation sur un NAS » du README.
#
# Seule condition préalable : déposer les échantillons dans
# /volume1/docker/speed/audio/ avec File Station. Ils restent hors de l'image,
# et changer de banque sonore se fait en remplaçant des fichiers.

services:
  speed:
    image: ghcr.io/davidp57/speed:latest
    container_name: speed
    restart: unless-stopped
    ports:
      # Port interne au NAS. C'est le proxy inversé de DSM qui l'expose en HTTPS.
      - "8088:80"
    volumes:
      - /volume1/docker/speed/audio:/usr/share/nginx/html/audio:ro
      # Facultatif : profils partagés entre appareils, déposés avec File Station.
      - /volume1/docker/speed/profiles:/usr/share/nginx/html/profiles:ro
      # Décommenter avec l'authentification de docker/nginx.conf :
      # - /volume1/docker/speed/htpasswd:/etc/nginx/htpasswd:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
