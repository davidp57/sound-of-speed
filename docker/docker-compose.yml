# Pile à coller dans Portainer : Stacks > Add stack > Web editor.
#
# L'image est construite et publiée par GitHub à chaque poussée sur `main`. Le
# NAS ne construit rien et ne reçoit aucun fichier : il tire une image prête.
#
# Pour essayer l'intégration avant qu'elle devienne une version, dupliquer cette
# pile sous un autre nom, avec l'étiquette `:develop` et un autre port.
# Mettre à jour tient alors à un bouton dans Portainer, sans terminal.
#
# Le registre étant privé comme le dépôt, Portainer doit s'y authentifier une
# fois pour toutes : voir la section « Installation sur un NAS » du README.
#
# Seule condition préalable : déposer les échantillons dans
# /volume1/docker/speed/audio/ avec File Station. Ils restent hors de l'image,
# et changer de banque sonore se fait en remplaçant des fichiers.

services:
  speed:
    image: ghcr.io/davidp57/speed:latest
    container_name: speed
    restart: unless-stopped
    ports:
      # Port interne au NAS. C'est le proxy inversé de DSM qui l'expose en HTTPS.
      - "8088:80"
    volumes:
      - /volume1/docker/speed/audio:/usr/share/nginx/html/audio:ro
      # Profils partagés entre appareils, déposés avec File Station.
      #
      # Le dossier doit **exister**, même vide : Docker sous DSM ne crée pas un
      # point de montage absent, il refuse de démarrer le conteneur. Le
      # commenter est l'autre issue, au prix de la bibliothèque de profils.
      #
      # **En lecture-écriture** depuis le lot REMONTEE : un profil réglé dans la
      # voiture y remonte tout seul, et c'est ce dossier que la bibliothèque lit.
      - /volume1/docker/speed/profiles:/usr/share/nginx/html/profiles
      # Dépôt des traces enregistrées en roulant. **En lecture-écriture** : le
      # navigateur de la voiture refuse tout téléchargement, c'est par là que les
      # traces en sortent. Le dossier doit exister, comme celui des profils, et
      # le dépôt exige le fichier de mots de passe ci-dessous.
      - /volume1/docker/speed/traces:/usr/share/nginx/html/traces
      # Ce que le profileur a mesuré de la vraie voiture. **En lecture seule**
      # de ce côté : c'est l'autre conteneur qui écrit, celui-ci ne fait que
      # servir le fichier. Le dossier doit exister, comme les autres.
      - /volume1/docker/speed/mesure-voiture:/usr/share/nginx/html/mesure-voiture:ro
      # Journal de bord, déposé tout seul en roulant. **En lecture-écriture**,
      # pour la même raison, et dans un dossier séparé : celui des traces est
      # servi en index JSON, et c'est cet index que l'application télécharge pour
      # les lister — une tranche de journal toutes les cinq minutes l'alourdirait
      # à chaque sortie. Rien n'y est déposé tant que le journal n'a pas été
      # accepté dans l'écran de configuration.
      - /volume1/docker/speed/journal:/usr/share/nginx/html/journal
      # Relevés de mesure, déposés par la sonde et par l'application. **En
      # lecture-écriture**, dans un dossier à part : ces fichiers se lisent un par
      # un, à la main, et se noieraient parmi les tranches de journal.
      - /volume1/docker/speed/mesures:/usr/share/nginx/html/mesures
      # Fichier de mots de passe. À décommenter dans **deux** cas, qui sont
      # indépendants :
      #
      #  - pour tout ce qui remonte depuis la voiture — traces, journal, relevés
      #    de mesure, profils. Les quatre emplacements de docker/nginx.conf
      #    exigent toujours de s'annoncer en écriture, et il n'y a rien d'autre à
      #    décommenter que cette ligne ;
      #  - pour protéger le site entier, si l'adresse est exposée hors du réseau
      #    local. Il faut alors aussi décommenter les deux lignes auth_basic de
      #    docker/nginx.conf.
      #
      # Le fichier se produit avec `npm run htpasswd`, sans Docker.
      # - /volume1/docker/speed/htpasswd:/etc/nginx/htpasswd:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Le profileur : il relit les traces déposées et en tire le profil de la vraie
  # voiture. Rien à exposer — il n'ouvre aucun port et ne sert rien ; c'est nginx,
  # au-dessus, qui sert ce qu'il écrit.
  #
  # Il vient du **même commit** que l'application : c'est ce qui garantit qu'ils
  # calculent la même chose. Redéployer l'une sans l'autre les ferait diverger.
  speed-profileur:
    image: ghcr.io/davidp57/speed-profileur:latest
    container_name: speed-profileur
    restart: unless-stopped
    volumes:
      # Les traces, en **lecture seule** : il les lit, il n'y touche pas.
      - /volume1/docker/speed/traces:/data/traces:ro
      # La mesure de la voiture, en lecture-écriture : c'est là qu'il dépose ce
      # qu'il a mesuré, dans le dossier que l'application sert déjà.
      - /volume1/docker/speed/mesure-voiture:/data/mesure-voiture
    environment:
      # Le relevé du dossier. Cinq secondes : une tranche arrive toutes les cinq
      # minutes en roulant, et lire une liste de noms ne coûte rien.
      SPEED_SCAN_MS: "5000"
